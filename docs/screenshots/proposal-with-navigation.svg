aining | state unsaved</text><text x="24" y="594"></text><text x="24" y="618">  proposal-with-navigation-decision-1 [unresolved]  design:L10</text><text x="24" y="642">▶ proposal-with-navigation-decision-2 [✅ answered]  workplan:L20</text><text x="24" y="666">  proposal-with-navigation-decision-3 [unresolved]  design:L30</text><text x="24" y="690"></text><text x="24" y="714">Decision: Add and revise a proposal after document review: decision 2</text><text x="24" y="738">  ▶ Expedite</text><text x="24" y="762">--- HELPER PANE ---</text><text x="24" y="786">Work remains:</text><text x="24" y="810">- select a proposal for: proposal-with-navigation-decision-1, proposal-with-navigation-decision-3</text><text x="24" y="834">- save the current decision state (s)</text><text x="24" y="858"></text><text x="24" y="882">Exit the TUI anyway?</text><text x="24" y="906">  No, stay    ▶ Yes, exit</text><text x="24" y="930">Use ←/→/↑/↓, then Enter.</text><text x="24" y="954"></text><text x="24" y="978">Human-in-the-loop decision session complete</text></g></svg>
