name: Android local-runner qualification

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow is intentionally manual: a self-hosted runner is a project
# owner's machine and must never be selected for untrusted pull-request code.
# Install the runner with tools/awui-android-runner.sh bootstrap, then add the
# labels self-hosted, linux, x64, and android.
concurrency:
  group: awui-android-local-runner
  cancel-in-progress: true

jobs:
  emulator-e2e:
    name: Android emulator E2E (local runner)
    runs-on: [self-hosted, linux, x64, android]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Android runner
        run: tools/awui-android-runner.sh doctor
      - name: Run emulator qualification
        run: tools/awui-android-runner.sh e2e
      - name: Upload local emulator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-local-emulator-e2e
          if-no-files-found: warn
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            android/build/connected-artifacts/**
            android/build/local-emulator.log
