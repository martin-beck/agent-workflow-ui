name: Android development APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "src/awtui/android*.py", "tests/test_android*.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/awtui/android*.py", "tests/test_android*.py", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  android-build:
    name: Android build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PawuiAbi=${{ matrix.abi }}
        env:
          ANDROID_ABI: ${{ matrix.abi }}
      - name: Generate checksum and build metadata
        run: |
          apk=$(find app/build/outputs/apk/debug -name 'app-*-debug.apk' -print -quit)
          sha256sum "$apk" > "$apk.sha256"
          sha256sum -c "$apk.sha256"
          printf 'commit=%s\nabi=%s\njava=%s\ngradle=%s\n' "$GITHUB_SHA" "${{ matrix.abi }}" "$(java -version 2>&1 | head -1)" "$(./gradlew --version | awk '/Gradle / {print $2; exit}')" > "${apk%.apk}-build-metadata.txt"
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > "${apk%.apk}-runtime-dependencies.txt"
          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          python3 - "$apk_sha" "${{ matrix.abi }}" > "${apk%.apk}-sbom.spdx.json" <<'PY'
          import json, sys
          digest, abi = sys.argv[1:]
          print(json.dumps({
              "spdxVersion": "SPDX-2.3", "dataLicense": "CC0-1.0",
              "SPDXID": "SPDXRef-DOCUMENT", "name": "agent-workflow-ui-android-debug",
              "documentNamespace": "https://github.com/martin-beck/agent-workflow-ui/android/" + abi,
              "creationInfo": {"created": "${{ github.run_started_at }}", "creators": ["Tool: agent-workflow-ui-ci"]},
              "packages": [{"SPDXID": "SPDXRef-Package-app", "name": "agent-workflow-ui-debug-apk",
                  "versionInfo": "${GITHUB_SHA}", "downloadLocation": "NOASSERTION",
                  "checksums": [{"algorithm": "SHA256", "checksumValue": digest}], "filesAnalyzed": False}]
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agent-workflow-ui-debug-apk-${{ matrix.abi }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.sha256
            android/app/build/outputs/apk/debug/*build-metadata.txt
            android/app/build/outputs/apk/debug/*runtime-dependencies.txt
            android/app/build/outputs/apk/debug/*sbom.spdx.json
            android/app/build/test-results/testDebugUnitTest/**
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error

  emulator-e2e:
    name: Android emulator E2E
    # Hosted emulators are opt-in. Pull requests use the controlled local
    # runner workflow instead, avoiding unbounded hosted emulator queues.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on a pinned emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu off
          disable-animations: false
          script: |
            cd android && timeout 12m ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace
            mkdir -p android/build/connected-artifacts
            adb exec-out screencap -p > android/build/connected-artifacts/emulator-workspace.png
      - name: Upload emulator test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-e2e-reports
          if-no-files-found: warn
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            android/build/connected-artifacts/**
