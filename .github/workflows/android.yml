name: Android development APK

on:
  push:
    branches: [main]
    paths: ["android/**", "src/awtui/android*.py", "tests/test_android*.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/awtui/android*.py", "tests/test_android*.py", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  android-build:
    name: Android build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        env:
          ANDROID_ABI: ${{ matrix.abi }}
      - name: Generate checksum and build metadata
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          printf 'commit=%s\nabi=%s\njava=%s\n' "$GITHUB_SHA" "${{ matrix.abi }}" "$(java -version 2>&1 | head -1)" > app/build/outputs/apk/debug/build-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-workflow-ui-debug-apk-${{ matrix.abi }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/build-metadata.txt
          if-no-files-found: error

  emulator-e2e:
    name: Android emulator E2E
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on a pinned emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest
