name: Release qualification

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install release test dependencies
        run: python3 -m pip install --upgrade pip '.[gui]' pytest
      - name: Verify immutable release identity
        run: |
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME#v}"
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
      - name: Run release and qualification checks
        run: |
          python3 -m pytest -q tests/test_release_contract.py tests/test_windows_qualification.py tests/test_performance.py
          python3 tools/awui-benchmark --output artifacts/release-scale-benchmark.json
      - name: Publish release-scale evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-scale-benchmark
          path: artifacts/release-scale-benchmark.json
