name: TUI scenarios

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tui-scenarios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[capture]' pytest
      - run: python -m pip install '.[gui]'
      - run: python tools/build_runtime_archive.py "$RUNNER_TEMP/awui-runtime.tar.gz"
      - name: Probe self-bootstrapping POSIX launcher
        run: |
          AWUI_SSH_HOST=probe AWUI_SESSION_FILE=/tmp/request.json AWUI_REMOTE_EVENT_FILE=/tmp/events.jsonl AWUI_PROBE_ONLY=1 sh tools/awui-bootstrap.sh
      - run: python tools/run_gui_screenshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: gui-batch-screenshot
          path: artifacts/gui-batch.png
      - run: rm -f artifacts/gui-batch.png
      - run: asciinema --version
      - run: python tools/validate_scenarios.py
      - run: python tools/run_scenarios.py
      - run: python tools/run_gui_scenarios.py --output-dir artifacts/gui-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: gui-scenario-screenshots
          path: artifacts/gui-screenshots/*.png
      - run: python tools/generate_scenario_docs.py
      - run: python tools/check_scenario_docs.py
      - name: Validate asciinema recordings
        run: |
          for recording in docs/recordings/*.cast; do
            asciinema play --out-fmt asciicast --speed 1000 "$recording" >/dev/null
          done
      - run: python -m pytest -q
      - name: Exercise actual ephemeral SSH round trip
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd --create-home --shell /bin/sh awui-ci || true
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/awui-ci-key"
          sudo install -d -m 700 -o awui-ci -g awui-ci /home/awui-ci/.ssh
          sudo install -m 600 -o awui-ci -g awui-ci "$RUNNER_TEMP/awui-ci-key.pub" /home/awui-ci/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t
          sudo /usr/sbin/sshd -D -p 22222 -o PidFile="$RUNNER_TEMP/awui-sshd.pid" -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o PermitRootLogin=no -o AllowUsers=awui-ci &
          sshd_pid=$!
          trap 'sudo kill "$sshd_pid"' EXIT
          python tools/run_ssh_roundtrip.py --host 127.0.0.1 --port 22222 --user awui-ci --identity "$RUNNER_TEMP/awui-ci-key" --remote-dir /tmp/awui-roundtrip --insecure-host-key-check
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf 'Host awui-e2e\n  HostName 127.0.0.1\n  Port 22222\n  User awui-ci\n  IdentityFile %s\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n' "$RUNNER_TEMP/awui-ci-key" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          python tools/run_token_e2e.py --ssh-host awui-e2e --remote-dir /tmp/awui-token-e2e
          remote_root=/tmp/awui-connect-e2e
          ssh awui-e2e "mkdir -p $remote_root; printf '%s' '{\"project_id\":\"connect-e2e\",\"session_id\":\"connect-e2e-1\",\"ar\":{\"ar_id\":\"AR-0099\",\"task_revision\":4}}' > $remote_root/request.json"
          python tools/run_connect_e2e.py --ssh-host awui-e2e --remote-request "$remote_root/request.json" --remote-result "$remote_root/gui-events.json" --backend gui
          python tools/run_connect_e2e.py --ssh-host awui-e2e --remote-request "$remote_root/request.json" --remote-result "$remote_root/tui-events.json" --backend tui
          ssh awui-e2e "test -s $remote_root/gui-events.json && test -s $remote_root/tui-events.json"
      - name: Fail on stale generated artifacts
        run: |
          git diff --check
          git diff --exit-code -- artifacts docs/SCENARIOS.md docs/recordings docs/screenshots docs/gui-screenshots
          test -z "$(git ls-files --others --exclude-standard -- artifacts docs/SCENARIOS.md docs/recordings docs/screenshots docs/gui-screenshots | grep -v '^artifacts/gui-screenshots/' || true)"
