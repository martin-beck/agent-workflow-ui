name: TUI Windows compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-x64-qualification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[gui]' pytest
      - run: python tools/build_runtime_archive.py "$env:RUNNER_TEMP\awui-runtime.tar.gz"
      - name: Probe self-bootstrapping Windows launcher
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/awui-bootstrap.ps1 -ProbeOnly -Verbose
      - run: python -m pytest -q tests/test_host.py tests/test_ui_selection.py tests/test_bridge.py tests/test_ssh_roundtrip.py tests/test_endpoint_discovery.py tests/test_ssh_e2e_matrix.py tests/test_windows_qualification.py
      - name: Run deterministic resilience matrix
        run: python tools/run_resilience_matrix.py --output-dir artifacts/resilience
      - uses: actions/upload-artifact@v4
        with:
          name: resilience-matrix-windows
          path: artifacts/resilience/resilience-matrix.json
      - run: python tools/qualify_windows.py --expected-architecture x64 --require-windows
      - run: python tools/run_gui_screenshot.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: gui-batch-screenshot-windows
          path: artifacts/gui-batch.png

  # ARM64 is intentionally opt-in: GitHub-hosted windows-latest is x64.  A
  # native ARM64 runner must be registered with this label before this job can
  # qualify; a mismatched runner fails closed instead of becoming green.
  native-arm64-qualification:
    if: ${{ vars.AWUI_NATIVE_ARM64_RUNNER == 'true' }}
    runs-on: [self-hosted, windows, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[gui]' pytest
      - run: python tools/qualify_windows.py --expected-architecture arm64 --require-windows
