name: TUI Windows compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-and-contract-smoke:
    strategy:
      matrix:
        # Hosted Windows provides the contract row; native ARM64 runners can
        # use this same job without changing the qualification command.
        architecture: [amd64, arm64]
    runs-on: windows-latest
    env:
      AWUI_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[gui]' pytest
      - run: python tools/build_runtime_archive.py "$env:RUNNER_TEMP\awui-runtime.tar.gz"
      - name: Probe self-bootstrapping Windows launcher
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/awui-bootstrap.ps1 -ProbeOnly -Verbose
      # Keep this job provider-neutral: Windows has no POSIX PTY guarantee.
      # It validates backend selection, manual handoff, private session files,
      # bounded append-only journals, and the revision-bound bridge contract.
      - run: python -m pytest -q tests/test_host.py tests/test_ui_selection.py tests/test_bridge.py tests/test_ssh_roundtrip.py
      - run: python tools/qualify_windows.py --expected-architecture "${{ matrix.architecture }}"
      - run: python tools/run_gui_screenshot.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: gui-batch-screenshot-windows
          path: artifacts/gui-batch.png
