[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-ui"
version = "0.5.1"
description = "Interactive human-in-the-loop GUI and terminal UI for Agent Workflow"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit==3.0.51", "rich==14.2.0"]

[project.optional-dependencies]
gui = ["PySide6==6.8.2"]
# Used by the scenario generator/CI to validate and play generated terminal
# animations. The committed recordings use asciinema v2 cast format.
capture = ["asciinema==2.4.0"]

[project.scripts]
awui-live = "awtui.launcher:main"
awtui-live = "awtui.live:main"
awui-connect = "awtui.connect:main"
awui = "awtui.shortcut:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
